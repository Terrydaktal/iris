"invariants.release_checks" = { status = "implemented_tested", reason = "Default and feature builds plus tests are listed.", implementation = "Cargo checks/tests", test = "commands in this contract" }
"invariants.resource_balances" = { status = "implemented_untested", reason = "Task completion/removal and worker status paths are explicit.", implementation = "task registry and indexer status", test = "feature task snapshot test" }
"live.capabilities_command" = { status = "implemented_tested", reason = "CLI returns diagnostic capabilities and bounds.", implementation = "handle_cli/capabilities_value", test = "cargo test build identity and manual CLI check" }
"live.snapshot_command" = { status = "implemented_tested", reason = "Private socket snapshot command is implemented.", implementation = "diagnostics control plane", test = "snapshot feature test" }
"performance_isolation.activated_mode_tests" = { status = "implemented_untested", reason = "Activated ring/task tests and external capture checks are declared.", implementation = "diagnostics tests and capture script", test = "commands in docs/DEBUGGABILITY.md" }
"performance_isolation.always_on_test" = { status = "implemented_untested", reason = "Always-on means the observable build with diagnostics enabled; it has bounded structures and no disk sink.", implementation = "diagnostics feature runtime", test = "representative workload comparison" }
"performance_isolation.baseline_comparison" = { status = "implemented_untested", reason = "Feature-off versus runtime-disabled comparison is specified.", implementation = "release profiles and contract", test = "manual benchmark procedure" }
"performance_isolation.critical_hot_paths" = { status = "implemented_untested", reason = "Critical GUI and indexer update paths are enumerated.", implementation = "heartbeat atomics and coalesced status writer", test = "code review and workload measurement" }
"performance_isolation.minimal_mode_test" = { status = "implemented_tested", reason = "Minimal build compiles with diagnostics removed.", implementation = "default Cargo features", test = "cargo check and cargo test --bin iris" }
"performance_isolation.runtime_disabled_test" = { status = "implemented_untested", reason = "Observable binary defaults to disabled runtime collection.", implementation = "IRIS_DIAGNOSTICS gate", test = "run observable binary without environment flag" }
"postmortem.retention_policy" = { status = "implemented_untested", reason = "Capture output location and system crash retention are documented.", implementation = "DEBUGGABILITY.md postmortem section", test = "manual capture review" }
"reproduction.fault_injection" = { status = "implemented_untested", reason = "The observable socket accepts an explicit synthetic task-failure probe without changing application state.", implementation = "diagnostics.rs inject task_failure command", test = "--diagnose-pid PID inject task_failure synthetic_probe synthetic_code synthetic_reason" }
"reproduction.recorded_inputs" = { status = "implemented_untested", reason = "Build/process/run and stage context are recorded.", implementation = "build info, capture script, indexer status", test = "capture/status inspection" }
"reproduction.replay_command" = { status = "implemented_tested", reason = "Live capture records a shell-escaped command plus working directory and selected environment; the helper restores that context only with explicit execution.", implementation = "diagnose_iris.sh and replay_iris_capture.sh", test = "tools/check_debuggability.sh replay integration test" }
"resources.declared_budgets" = { status = "implemented_tested", reason = "All diagnostic buffers, request sizes, TTL, and status interval have bounds.", implementation = "constants and contract", test = "diagnostic ring test and code review" }
"security.authorization" = { status = "implemented_tested", reason = "Local socket permissions restrict the control surface to the user.", implementation = "Unix socket mode 0600", test = "control_plane_can_activate_runtime_disabled_state" }
"security.redaction" = { status = "implemented_tested", reason = "Snapshot path redaction is asserted and bundle privacy is documented.", implementation = "snapshot fields omit media content", test = "snapshot redaction test" }
