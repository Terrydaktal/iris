"audit_trail.tamper_evidence" = { status = "not_applicable", reason = "No durable audit artifact is produced.", implementation = "No durable audit sink", test = "Exception recorded above" }
"audit_trail.transaction_binding" = { status = "not_applicable", reason = "No durable audit records are emitted.", implementation = "No durable audit sink", test = "Exception recorded above" }
"build.identity" = { status = "implemented_tested", reason = "Build identity is generated and exposed by CLI.", implementation = "build.rs and --build-info", test = "build_identity_exposes_reproducible_fields" }
"deployment_modes.diagnostic_builds" = { status = "implemented_tested", reason = "Cargo feature defines the observable build.", implementation = "diagnostics feature in Cargo.toml", test = "cargo check --features diagnostics" }
"deployment_modes.global_runtime_switch" = { status = "implemented_tested", reason = "Runtime diagnostics are opt-in and can be activated through the local socket even when the observable process started disabled.", implementation = "IRIS_DIAGNOSTICS and activate command", test = "control_plane_can_activate_runtime_disabled_state" }
"deployment_modes.minimal_release" = { status = "implemented_tested", reason = "Default features exclude the diagnostic implementation.", implementation = "default Cargo feature set", test = "cargo check" }
