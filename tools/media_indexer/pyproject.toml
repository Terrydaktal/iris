[project]
name = "media-indexer"
version = "0.1.0"
description = "GPU media indexing pipeline for faces, embeddings, and OCR metadata"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "easyocr>=1.7.2",
    "insightface>=0.7.3",
    "lancedb>=0.30.1",
    "numpy>=2.4.3",
    "onnxruntime-gpu[cuda,cudnn]>=1.26.0",
    "onnxscript>=0.7.0",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=4.13.0.92",
    "paddleocr>=3.4.0",
    "paddlepaddle==3.3.0",
    "pillow>=12.1.1",
    "pyarrow>=23.0.1",
    "scenedetect>=0.6.7.1",
    "sentence-transformers>=5.3.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.67.3",
]

[project.scripts]
embedimages = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "easyocr_worker", "face_worker", "paddle_worker"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
